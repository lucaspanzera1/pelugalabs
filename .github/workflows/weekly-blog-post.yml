name: Weekly Blog Post Generator

on:
  schedule:
    # Runs every Monday at 09:00 UTC (every 7 days)
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual trigger
    inputs:
      theme:
        description: "Tema opcional para o artigo (ex.: quanto custa desenvolver um sistema sob medida)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install groq google-genai

      - name: Generate blog post
        id: generate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_THEME: ${{ github.event.inputs.theme }}
        run: python scripts/generate_blog_post.py

      - name: Commit and push new post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          [ -d public/images/blog ] && git add public/images/blog/ || true
          if git diff --cached --quiet; then
            echo "No new post was generated."
          else
            POST_FILE=$(git diff --cached --name-only | head -1)
            git commit -m "feat: add weekly blog post - $(date +'%Y-%m-%d')"
            git push
            echo "Post published: $POST_FILE"
          fi
